[package]
name = "milena"
version = "0.1.0"
description = "Milena local macOS Kafka developer workbench"
authors = ["Milena contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "milena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "milena"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
