[package]
name = "milena"
version = "0.3.1"
description = "Milena local macOS Kafka developer workbench"
authors = ["Milena contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "milena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "milena"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "libz", "naive-runtime", "ssl-vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
