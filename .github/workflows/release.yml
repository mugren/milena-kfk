name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test React frontend
        run: npm run test

      - name: Build React frontend
        run: npm run build

      - name: Validate approved scenario metadata
        run: npm run e2e:scenarios -- list

      - name: Test Rust and Tauri backend
        working-directory: src-tauri
        run: cargo test

      - name: Build macOS app bundle
        run: npm run tauri:build

      - name: Package macOS app bundle
        run: |
          app_bundle="src-tauri/target/release/bundle/macos/Milena - Kafka Reader.app"
          asset_name="Milena-${{ github.event.release.tag_name }}-macos.zip"

          if [ ! -d "$app_bundle" ]; then
            echo "Expected app bundle not found: $app_bundle" >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_ENV"

      - name: Attach macOS app bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$asset_name" --clobber --repo "$GITHUB_REPOSITORY"
